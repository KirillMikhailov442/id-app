name: CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, dev]

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-stage:
    uses: ./.github/workflows/test.yml

  build-stage:
    needs: test-stage
    uses: ./.github/workflows/build.yml
