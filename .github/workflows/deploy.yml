name: Deploy

on:
  workflow_call:
    secrets:
      VPS_SSH_KEY:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: dist-artifact
          path: deploy/dist

      - name: Upload and deploy to VPS
        shell: bash
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077

          : "${VPS_HOST:?Set VPS_HOST}"
          : "${VPS_USER:?Set VPS_USER}"
          : "${VPS_SSH_KEY:?Set VPS_SSH_KEY}"

          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/vps_key"

          target="$VPS_USER@$VPS_HOST"
          ssh_options=(
            -i "$RUNNER_TEMP/vps_key"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=accept-new
            -o "UserKnownHostsFile=$RUNNER_TEMP/vps_known_hosts"
          )

          staging=$(ssh "${ssh_options[@]}" "$target" 'mktemp -d /tmp/id-app.XXXXXXXX')
          [[ "$staging" =~ ^/tmp/id-app\.[[:alnum:]]{8}$ ]]

          cleanup() {
            ssh "${ssh_options[@]}" "$target" "rm -rf -- '$staging'"
          }
          trap cleanup EXIT

          scp "${ssh_options[@]}" -r deploy/dist nginx.conf "$target:$staging/"
          ssh "${ssh_options[@]}" "$target" \
            "sudo -n /usr/local/sbin/deploy-id-app '$staging'"
